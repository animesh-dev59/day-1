<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>বাংলা মোটিভেশন হাব - ১০০০+ অনুপ্রেরণামূলক উক্তি</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Google Fonts (Hind Siliguri) -->
    <link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body class="bg-gradient-to-br from-slate-900 via-indigo-950 to-slate-900 text-slate-100 min-h-screen flex flex-col justify-between selection:bg-amber-500 selection:text-slate-950">

    <!-- Header Section -->
    <header class="w-full py-6 px-4 bg-slate-900/80 backdrop-blur-md border-b border-slate-800 sticky top-0 z-50">
        <div class="max-w-7xl mx-auto flex flex-col md:flex-row justify-between items-center gap-4">
            <h1 class="text-2xl md:text-3xl font-bold bg-gradient-to-r from-amber-400 to-orange-500 bg-clip-text text-transparent flex items-center gap-2">
                ✨ বাংলা মোটিভেশন হাব
            </h1>
            <div class="flex items-center gap-3 w-full md:w-auto">
                <input type="text" id="searchInput" placeholder="উক্তি বা লেখকের নাম দিয়ে খুঁজুন..." 
                    class="bg-slate-800/80 border border-slate-700 px-4 py-2.5 rounded-xl text-sm focus:outline-none focus:border-amber-500 w-full md:w-80 transition shadow-inner">
                <button id="randomBtn" class="bg-amber-500 hover:bg-amber-600 text-slate-950 font-semibold px-4 py-2.5 rounded-xl text-sm transition shadow-lg shadow-amber-500/20 whitespace-nowrap active:scale-95">
                    র‌্যান্ডম উক্তি
                </button>
            </div>
        </div>
    </header>

    <!-- Category Filter Bar -->
    <nav class="max-w-7xl mx-auto px-4 py-6 w-full">
        <div id="categoryContainer" class="flex gap-2 overflow-x-auto pb-2 scrollbar-none">
            <button class="cat-btn active px-4 py-2 rounded-xl text-sm font-medium bg-amber-500 text-slate-950 transition whitespace-nowrap shadow-md" data-cat="all">সব উক্তি</button>
            <button class="cat-btn px-4 py-2 rounded-xl text-sm font-medium bg-slate-800/80 hover:bg-slate-700 text-slate-300 transition whitespace-nowrap border border-slate-700/50" data-cat="success">সাফল্য</button>
            <button class="cat-btn px-4 py-2 rounded-xl text-sm font-medium bg-slate-800/80 hover:bg-slate-700 text-slate-300 transition whitespace-nowrap border border-slate-700/50" data-cat="hardwork">কঠোর পরিশ্রম</button>
            <button class="cat-btn px-4 py-2 rounded-xl text-sm font-medium bg-slate-800/80 hover:bg-slate-700 text-slate-300 transition whitespace-nowrap border border-slate-700/50" data-cat="failure">ব্যর্থতা ও ঘুরে দাঁড়ানো</button>
            <button class="cat-btn px-4 py-2 rounded-xl text-sm font-medium bg-slate-800/80 hover:bg-slate-700 text-slate-300 transition whitespace-nowrap border border-slate-700/50" data-cat="mindset">মানসিক শক্তি</button>
        </div>
    </nav>

    <!-- Main Content Grid -->
    <main class="max-w-7xl mx-auto px-4 pb-16 flex-grow w-full">
        <div id="quoteGrid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
            <!-- Dynamic Quote Cards will load here -->
        </div>
        <div id="noResults" class="hidden text-center py-20 text-slate-400 text-lg">
            কোনো উক্তি খুঁজে পাওয়া যায়নি! অন্য কিছু সার্চ করুন।
        </div>
    </main>

    <!-- Author Reveal Modal -->
    <div id="authorModal" class="fixed inset-0 bg-black/70 backdrop-blur-sm z-50 flex items-center justify-center p-4 hidden opacity-0 transition-opacity duration-300">
        <div class="bg-slate-900 border border-slate-700 rounded-2xl max-w-md w-full p-6 text-center shadow-2xl transform scale-95 transition-transform duration-300" id="modalContentBox">
            <div class="w-16 h-16 bg-amber-500/10 text-amber-400 rounded-full flex items-center justify-center mx-auto mb-4 text-2xl font-bold border border-amber-500/20 shadow-inner">
                👤
            </div>
            <p class="text-xs text-amber-400 uppercase tracking-widest font-semibold mb-1">উক্তিটির প্রবক্তা</p>
            <h3 id="modalAuthorName" class="text-2xl font-bold text-white mb-3">লেখক বা মনীষীর নাম</h3>
            <p id="modalAuthorBio" class="text-slate-400 text-sm mb-6 leading-relaxed">সম্পর্কিত সংক্ষিপ্ত বিবরণ বা প্রবক্তার পরিচিতি এখানে প্রদর্শিত হবে।</p>
            <button id="closeModal" class="w-full bg-slate-800 hover:bg-slate-700 text-slate-200 font-medium py-2.5 rounded-xl transition border border-slate-700">
                বন্ধ করুন
            </button>
        </div>
    </div>

    <!-- Footer -->
    <footer class="bg-slate-900/80 border-t border-slate-800 py-6 text-center text-slate-500 text-sm">
        <p>© বাংলা মোটিভেশন হাব। সর্বস্বত্ব সংরক্ষিত।</p>
    </footer>

    <!-- Script Links -->
    <script src="quotes.js"></script>
    <script src="app.js"></script>
</body>
</html>
